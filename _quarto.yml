project:
  type: website
  output-dir: _site

website:
  title: "Giulia Bertagnolli"
  site-url: "https://gbertagnolli.github.io"
  description: "Personal academic website of Giulia Bertagnolli"
  favicon: images/favicon.png
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: talks.qmd
        text: Talks
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      # - href: posts.qmd
      #   text: Posts
    right:
      - icon: github
        href: https://github.com/gbertagnolli
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/
        aria-label: LinkedIn
      - icon: mortarboard
        href: https://scholar.google.com/
        aria-label: Google Scholar
  page-footer:
    left: "© 2026 Giulia Bertagnolli"
    right: "Built with [Quarto](https://quarto.org/)"
  search: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true

execute:
  freeze: auto
